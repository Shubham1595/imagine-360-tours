services:
  - type: web
    name: imagine360tours-api
    runtime: node
    rootDir: backend
    plan: starter
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://www.imagine360tours.in
      - key: CORS_ORIGINS
        value: https://www.imagine360tours.in,https://imagine360tours.in
